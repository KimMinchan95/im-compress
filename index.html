<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#100f0d" />
        <title>이미지 압축</title>
        <meta
            name="description"
            content="JPG, WebP, PNG를 올리면 바로 줄일 수 있어요. 원본이랑도 바로 비교할 수 있어요."
        />
        <meta property="og:type" content="website" />
        <meta property="og:locale" content="ko_KR" />
        <meta property="og:site_name" content="이미지 압축" />
        <meta property="og:title" content="이미지를 가볍게 줄여 보세요" />
        <meta
            property="og:description"
            content="JPG, WebP, PNG를 올리면 바로 줄일 수 있어요. 원본이랑도 바로 비교할 수 있어요."
        />
        <meta property="og:image" content="/og.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="이미지를 가볍게 줄여 보세요" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="이미지를 가볍게 줄여 보세요" />
        <meta
            name="twitter:description"
            content="JPG, WebP, PNG를 올리면 바로 줄일 수 있어요. 원본이랑도 바로 비교할 수 있어요."
        />
        <meta name="twitter:image" content="/og.png" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <script>
            try {
                var saved = JSON.parse(
                    localStorage.getItem('im-compress-preferences') || '{}'
                );
                var version = typeof saved.version === 'number' ? saved.version : 0;
                var choice = saved.state && saved.state.theme;
                var locale =
                    saved.state && saved.state.locale === 'en' ? 'en' : 'ko';
                var prefersLight = window.matchMedia(
                    '(prefers-color-scheme: light)'
                ).matches;
                var theme = prefersLight ? 'light' : 'dark';
                if (version >= 1 && (choice === 'light' || choice === 'dark'))
                    theme = choice;
                document.documentElement.dataset.theme = theme;
                document.documentElement.lang = locale;
                var themeColor = document.querySelector(
                    'meta[name="theme-color"]'
                );
                if (themeColor)
                    themeColor.setAttribute(
                        'content',
                        theme === 'light' ? '#f3efe7' : '#100f0d'
                    );
            } catch (error) {
                var fallbackLight = window.matchMedia(
                    '(prefers-color-scheme: light)'
                ).matches;
                document.documentElement.dataset.theme = fallbackLight
                    ? 'light'
                    : 'dark';
            }
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
