<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#100f0d" />
        <title>이미지 압축</title>
        <script>
            try {
                var saved = JSON.parse(
                    localStorage.getItem('im-compress-preferences') || '{}'
                );
                var theme =
                    saved.state && saved.state.theme === 'light'
                        ? 'light'
                        : 'dark';
                var locale =
                    saved.state && saved.state.locale === 'en' ? 'en' : 'ko';
                document.documentElement.dataset.theme = theme;
                document.documentElement.lang = locale;
                var themeColor = document.querySelector(
                    'meta[name="theme-color"]'
                );
                if (themeColor)
                    themeColor.setAttribute(
                        'content',
                        theme === 'light' ? '#f3efe7' : '#100f0d'
                    );
            } catch (error) {
                document.documentElement.dataset.theme = 'dark';
            }
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
